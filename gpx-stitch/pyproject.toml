[project]
name = "gpx-stitch"
version = "0.1.0"
description = "MCP server that stitches existing GPX tracks into one continuous course (mi/ft, USGS DEM elevation)"
requires-python = ">=3.11"
dependencies = [
  "mcp>=2.3,<3",
  "gpxpy>=1.6",
  "httpx>=0.27",
  "numpy>=1.26",
  "uvicorn>=0.30",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
gpx-stitch = "gpx_stitch.server:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["gpx_stitch"]
