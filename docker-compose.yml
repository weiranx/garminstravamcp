services:
  autoheal:
    image: willfarrell/autoheal:latest
    container_name: autoheal
    restart: unless-stopped
    environment:
      - AUTOHEAL_CONTAINER_LABEL=autoheal
      - AUTOHEAL_INTERVAL=10
      - AUTOHEAL_START_PERIOD=30
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

  garmin-mcp:
    build: .
    container_name: garmin-mcp
    restart: unless-stopped
    labels:
      - autoheal=true
    ports:
      - "8101:8101"
    environment:
      - CLIENT_ID=${CLIENT_ID}
      - CLIENT_SECRET=${CLIENT_SECRET}
      - BASE_URL=${BASE_URL}
    volumes:
      # Persist Garmin OAuth tokens across container restarts
      - garmin-tokens:/root/.garminconnect
      # Shared with gpx-mcp so upload_course can read courses exported by gpx-stitch
      - /srv/gpx:/srv/gpx
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8101/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  strava-mcp:
    build: .
    command: ["node", "strava-server.js"]
    container_name: strava-mcp
    restart: unless-stopped
    labels:
      - autoheal=true
    ports:
      - "8102:8102"
    environment:
      - CLIENT_ID=${STRAVA_MCP_CLIENT_ID}
      - CLIENT_SECRET=${STRAVA_MCP_CLIENT_SECRET}
      - BASE_URL=${STRAVA_BASE_URL}
      - STRAVA_CLIENT_ID=${STRAVA_API_CLIENT_ID}
      - STRAVA_CLIENT_SECRET=${STRAVA_API_CLIENT_SECRET}
      - STRAVA_ACCESS_TOKEN=${STRAVA_ACCESS_TOKEN}
      - STRAVA_REFRESH_TOKEN=${STRAVA_REFRESH_TOKEN}
    volumes:
      # Persist Strava OAuth tokens across container restarts
      - strava-tokens:/root/.config/strava-mcp
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8102/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  coros-mcp:
    build: .
    command: ["node", "coros-server.js"]
    container_name: coros-mcp
    restart: unless-stopped
    labels:
      - autoheal=true
    ports:
      - "8103:8103"
    environment:
      - CLIENT_ID=${COROS_MCP_CLIENT_ID}
      - CLIENT_SECRET=${COROS_MCP_CLIENT_SECRET}
      - BASE_URL=${COROS_BASE_URL}
      - COROS_EMAIL=${COROS_EMAIL}
      - COROS_PASSWORD=${COROS_PASSWORD}
      - COROS_REGION=${COROS_REGION}
    volumes:
      # Persist COROS auth and OAuth tokens across container restarts
      - coros-tokens:/root/.config/coros-mcp
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8103/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  gpx-mcp:
    profiles: [gpx]
    build: .
    command: ["node", "gpx-server.js"]
    container_name: gpx-mcp
    restart: unless-stopped
    labels:
      - autoheal=true
    ports:
      - "8104:8104"
    environment:
      - CLIENT_ID=${GPX_MCP_CLIENT_ID}
      - CLIENT_SECRET=${GPX_MCP_CLIENT_SECRET}
      - BASE_URL=${GPX_BASE_URL}
      - GPX_OAUTH_REDIRECT_URIS=${GPX_OAUTH_REDIRECT_URIS:-}
      - ORS_API_KEY=${ORS_API_KEY:-}
      - ELEVATION_PROVIDER=${ELEVATION_PROVIDER:-opentopodata}
      - OPENTOPODATA_URL=${OPENTOPODATA_URL:-https://api.opentopodata.org}
      - OPENTOPODATA_DATASET=${OPENTOPODATA_DATASET:-ned10m}
    volumes:
      # Persist working tracks and MCP OAuth tokens across container restarts
      - gpx-stitch:/root/.config/gpx-stitch
      # inbox/ for manual GPX downloads, out/ for exported courses (also mounted in garmin-mcp)
      - /srv/gpx:/srv/gpx
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8104/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

volumes:
  garmin-tokens:
  strava-tokens:
  coros-tokens:
  gpx-stitch:
